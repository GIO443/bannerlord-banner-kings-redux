name: Sync wiki from docs/wiki/

# Pushes docs/wiki/*.md → the GitHub Wiki on every change. The wiki is
# a multi-page handbook split across topic groups (Home, Installing,
# Getting-Started, Systems-Reference, Player-Guide, Shipping-and-Trade,
# Slavery-and-Raiding, Troubleshooting). Each .md file in docs/wiki/
# becomes a wiki page of the same name (Home.md → Home, etc.).
#
# The wiki is itself a git repo at <repo>.wiki.git; this job clones it,
# replaces its contents with docs/wiki/*.md, and commits if anything
# changed. Old pages that no longer exist in docs/wiki/ are deleted
# from the wiki so renames and removals propagate cleanly.
#
# IMPORTANT: this is one-way (repo → wiki). Direct edits to the wiki
# in the GitHub UI will be overwritten on the next docs/wiki/ push.
# If you want to change the wiki, edit a file under docs/wiki/ and push.
#
# Prerequisite: the wiki must already exist on the repo (create one
# manual page in the GitHub UI to initialize the .wiki.git repo). After
# that, this workflow keeps it in sync.

on:
  push:
    branches:
      - main
    paths:
      - docs/wiki/**
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Clone wiki repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo

      - name: Mirror docs/wiki/ to wiki repo
        run: |
          # Wipe any existing .md pages and the assets/ folder in the wiki
          # working tree so renames and removals propagate. Preserve .git/
          # and any wiki-only files (sidebar, footer).
          find wiki-repo -maxdepth 1 -type f -name '*.md' -delete
          rm -rf wiki-repo/assets
          # Copy all docs/wiki/*.md and the assets/ folder to the wiki root.
          cp docs/wiki/*.md wiki-repo/
          if [ -d docs/wiki/assets ]; then
            cp -r docs/wiki/assets wiki-repo/assets
          fi

      - name: Commit and push if changed
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date — no commit needed."
            exit 0
          fi
          git commit -m "Sync from docs/wiki/ @ ${{ github.sha }}"
          git push
