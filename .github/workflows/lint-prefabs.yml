name: Lint prefabs

# Advisory Gauntlet-prefab linter. Runs tools/lint-prefabs.ps1, which scans
# BannerKings/_Module/GUI/Prefabs for malformed XML and the StretchToParent
# + VerticalBottomToTop "bottom-pile" smell. The script always exits 0 —
# findings are surfaced in the run log, the job never fails the build.

on:
  push:
    paths:
      - 'BannerKings/_Module/GUI/Prefabs/**'
      - 'tools/lint-prefabs.ps1'
      - '.github/workflows/lint-prefabs.yml'
  pull_request:
    paths:
      - 'BannerKings/_Module/GUI/Prefabs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Gauntlet prefabs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run prefab linter
        run: pwsh -File tools/lint-prefabs.ps1
